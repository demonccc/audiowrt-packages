name: Build AudioWRT Packages
run-name: Build packages / ${{ github.ref_name }} / ${{ inputs.package || 'pending' }}

on:
  push:
    branches:
      - testing
  workflow_dispatch:
    inputs:
      package:
        description: "Package source directory name, 'all', or empty for pending packages"
        required: false
        default: ''
        type: string
      jobs:
        description: "Parallel make jobs inside each SDK build"
        required: true
        default: '4'
        type: string

permissions:
  contents: read

concurrency:
  group: package-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  plan:
    needs: validate
    if: github.ref_name == 'testing' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      should_build: ${{ steps.plan.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        shell: bash
        env:
          REQUESTED: ${{ inputs.package || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED" ]]; then
            matrix="$(python3 scripts/plan-package-builds-matrix.py --package "$REQUESTED" --head "$GITHUB_SHA")"
          else
            matrix=""
            for attempt in 1 2 3 4 5; do
              if matrix="$(python3 scripts/plan-package-builds-matrix.py \
                --repository "$GITHUB_REPOSITORY" \
                --channel testing \
                --head "$GITHUB_SHA")"; then
                break
              fi
              if (( attempt == 5 )); then
                echo "ERROR: package planner failed after $attempt attempts" >&2
                exit 1
              fi
              delay=$((5 * (2 ** (attempt - 1))))
              echo "WARNING: planner failed; retrying in ${delay}s ($attempt/5)" >&2
              sleep "$delay"
            done
          fi

          count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<<"$matrix")"
          tasks="$(python3 -c 'import json,sys; print(sum(x["task_count"] for x in json.load(sys.stdin)["include"]))' <<<"$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if (( count > 0 )); then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Planned $tasks pending package task(s) in $count independent build job(s)"
          python3 -m json.tool <<<"$matrix"

  build:
    needs: plan
    if: needs.plan.outputs.should_build == 'true'
    name: ${{ matrix.release }} / ${{ matrix.arch == 'all' && 'no-arch' || matrix.arch }} / ${{ matrix.task_count }} pending task(s)
    runs-on: ubuntu-24.04
    container:
      image: demonccc/openwrt-builder:latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout AudioWRT packages
        uses: actions/checkout@v4

      - name: Restore OpenWrt SDK workspace
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/audiowrt-packages
          key: audiowrt-packages-v12-${{ runner.os }}-${{ matrix.release }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            audiowrt-packages-v12-${{ runner.os }}-${{ matrix.release }}-${{ matrix.arch }}-

      - name: Validate planned tasks against executor
        shell: bash
        env:
          TASKS_JSON: ${{ matrix.tasks_json }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          import build
          known = build.packages()
          tasks = json.loads(os.environ["TASKS_JSON"])
          unknown = sorted({task["package"] for task in tasks} - known.keys())
          if unknown:
              raise SystemExit(f"Planner referenced unknown packages: {unknown}")
          print(f"Validated {len(tasks)} planned tasks against canonical package names")
          PY

      - name: Build selected packages using the Python SDK builder
        shell: bash
        env:
          RELEASE: ${{ matrix.release }}
          ARCH: ${{ matrix.arch }}
          TASKS_JSON: ${{ matrix.tasks_json }}
          MAKE_JOBS: ${{ inputs.jobs || '4' }}
          PYTHONUNBUFFERED: '1'
          HOME: /tmp
        run: |
          set -euo pipefail
          python3 scripts/build.py build \
            --release "$RELEASE" \
            --arch "$ARCH" \
            --tasks-json "$TASKS_JSON" \
            --jobs "$MAKE_JOBS" \
            --output output \
            --cache-dir .cache/audiowrt-packages \
            --log-file "logs/build-${RELEASE}-${ARCH}.log"

      - name: Save OpenWrt SDK workspace
        if: ${{ always() && steps.sdk-cache.outcome == 'success' && steps.sdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/audiowrt-packages
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Upload architecture build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.release }}-${{ matrix.arch }}
          path: |
            output/
            logs/
          if-no-files-found: warn
          retention-days: 30
