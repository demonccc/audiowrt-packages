name: Build AudioWRT Packages
run-name: Build packages / ${{ github.ref_name }} / ${{ inputs.package || 'pending' }}

on:
  push:
    branches:
      - testing
  workflow_dispatch:
    inputs:
      package:
        description: "Package source directory name, 'all', or empty for pending packages"
        required: false
        default: ''
        type: string
      jobs:
        description: "Parallel make jobs inside each SDK build"
        required: true
        default: '4'
        type: string

permissions:
  contents: read

concurrency:
  group: package-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  plan:
    needs: validate
    if: github.ref_name == 'testing'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      should_build: ${{ steps.plan.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        shell: bash
        env:
          REQUESTED: ${{ inputs.package || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED" ]]; then
            matrix="$(python3 scripts/plan-package-builds-matrix.py --package "$REQUESTED" --head "$GITHUB_SHA")"
          else
            matrix=""
            for attempt in 1 2 3 4 5; do
              if matrix="$(python3 scripts/plan-package-builds-matrix.py \
                --repository "$GITHUB_REPOSITORY" \
                --channel testing \
                --head "$GITHUB_SHA")"; then
                break
              fi
              if (( attempt == 5 )); then
                echo "ERROR: package planner failed after $attempt attempts" >&2
                exit 1
              fi
              delay=$((5 * (2 ** (attempt - 1))))
              echo "WARNING: planner failed; retrying in ${delay}s ($attempt/5)" >&2
              sleep "$delay"
            done
          fi

          count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<<"$matrix")"
          tasks="$(python3 -c 'import json,sys; print(sum(x["task_count"] for x in json.load(sys.stdin)["include"]))' <<<"$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if (( count > 0 )); then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Planned $tasks pending package task(s) in $count independent build job(s)"
          python3 -m json.tool <<<"$matrix"

  build:
    needs: plan
    if: needs.plan.outputs.should_build == 'true'
    name: ${{ matrix.release }} / ${{ matrix.arch }} / ${{ matrix.task_count }} pending task(s)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout AudioWRT packages
        uses: actions/checkout@v4

      - name: Checkout canonical AudioWRT build engine
        uses: actions/checkout@v4
        with:
          repository: demonccc/audiowrt
          ref: 680f766ac513d3c9bdcc6ea04f20ac0b8f59b207
          path: .audiowrt-engine
          fetch-depth: 1

      - name: Prepare canonical engine for package contexts
        run: python3 scripts/prepare-canonical-engine.py .audiowrt-engine

      - name: Restore canonical build cache
        uses: actions/cache@v4
        with:
          path: .audiowrt-engine/.cache/audiowrt-packages
          key: audiowrt-packages-v9-canonical-${{ runner.os }}-${{ matrix.release }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            audiowrt-packages-v9-canonical-${{ runner.os }}-${{ matrix.release }}-${{ matrix.arch }}-

      - name: Build pending packages with canonical AudioWRT builder
        shell: bash
        env:
          RELEASE: ${{ matrix.release }}
          ARCH: ${{ matrix.arch }}
          TASKS_JSON: ${{ matrix.tasks_json }}
          MAKE_JOBS: ${{ inputs.jobs || '4' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUDIOWRT_ENGINE_DIR: ${{ github.workspace }}/.audiowrt-engine
        run: bash scripts/build-publish-incremental.sh

      - name: Upload architecture build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.release }}-${{ matrix.arch }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
