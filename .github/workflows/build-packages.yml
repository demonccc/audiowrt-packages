name: Build AudioWRT Packages
run-name: Packages ${{ inputs.audiowrt_profile }} / ${{ inputs.package }}

on:
  workflow_dispatch:
    inputs:
      audiowrt_profile:
        description: "AudioWRT profile used to select architecture and exact OpenWrt SDK"
        required: true
        default: tplink-tl-wdr4300-v1-minimal-usb-bluetooth-25.12.5
        type: string
      package:
        description: "Package name, or 'all' for every AudioWRT package selected by the profile"
        required: true
        default: all
        type: string
      audiowrt_ref:
        description: "AudioWRT builder branch, tag or commit"
        required: true
        default: main
        type: string
      jobs:
        description: "Parallel SDK build jobs"
        required: true
        default: '4'
        type: string
      verbosity:
        description: "SDK build log detail"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - verbose
          - debug

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.audiowrt_profile }}-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout AudioWRT packages
        uses: actions/checkout@v4

      - name: Checkout AudioWRT build engine
        uses: actions/checkout@v4
        with:
          repository: demonccc/audiowrt
          ref: ${{ inputs.audiowrt_ref }}
          path: builder

      - name: Restore SDK download cache
        uses: actions/cache@v4
        with:
          path: builder/.cache/audiowrt
          key: audiowrt-packages-${{ runner.os }}-${{ inputs.audiowrt_profile }}-${{ inputs.audiowrt_ref }}
          restore-keys: |
            audiowrt-packages-${{ runner.os }}-${{ inputs.audiowrt_profile }}-

      - name: Build package APKs
        shell: bash
        run: |
          set -euo pipefail
          package_ref="$(git rev-parse HEAD)"

          make -C builder packages \
            AUDIOWRT_PROFILE='${{ inputs.audiowrt_profile }}' \
            PACKAGE='${{ inputs.package }}' \
            AUDIOWRT_PACKAGES_REF="$package_ref" \
            JOBS='${{ inputs.jobs }}' \
            VERBOSITY='${{ inputs.verbosity }}' \
            CACHE_DIR='.cache/audiowrt'

      - name: Show produced APKs
        if: success()
        shell: bash
        run: |
          find "builder/output/packages/${{ inputs.audiowrt_profile }}/packages" \
            -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: audiowrt-packages-${{ inputs.audiowrt_profile }}-${{ inputs.package }}
          path: builder/output/packages/${{ inputs.audiowrt_profile }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audiowrt-packages-failure-${{ inputs.audiowrt_profile }}-${{ inputs.package }}
          path: |
            builder/output/
            builder/.work/packages/
          if-no-files-found: warn
          retention-days: 7
