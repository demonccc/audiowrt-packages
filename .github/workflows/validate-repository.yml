name: Validate package repository tooling

on:
  pull_request:
  push:
    branches:
      - main
      - testing

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile Python tooling
        run: python3 -m py_compile scripts/*.py

      - name: Validate shell tooling
        run: bash -n scripts/build-package-context.sh

      - name: Validate architecture matrix
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('repository/build-matrix.toml').read_text())
          assert data['schema_version'] == 1
          arches = data['architectures']
          expected = {
              'mips_24kc',
              'arm_cortex-a7_neon-vfpv4',
              'aarch64_cortex-a72',
              'x86_64',
          }
          assert set(arches) == expected
          for arch, cfg in arches.items():
              assert cfg['versions']
              for version, version_cfg in cfg['versions'].items():
                  assert version
                  assert '/' in version_cfg['sdk_target']
                  assert version_cfg['kernel_targets']
                  assert all('/' in item for item in version_cfg['kernel_targets'])
          PY

      - name: Validate rebuild rules
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('repository/rebuild-dependents.json').read_text())
          assert data['schema'] == 1
          assert isinstance(data['rebuild_dependents'], dict)
          for package, dependents in data['rebuild_dependents'].items():
              assert package
              assert isinstance(dependents, list)
              assert len(dependents) == len(set(dependents))
          PY

      - name: Smoke-test empty planner diff
        run: |
          matrix="$(python3 scripts/plan-package-builds.py --base HEAD --head HEAD)"
          python3 -c 'import json,sys; assert json.load(sys.stdin) == {"include": []}' <<<"$matrix"

      - name: Smoke-test complete planner matrix
        run: |
          matrix="$(python3 scripts/plan-package-builds.py --package all)"
          python3 - <<'PY' <<<"$matrix"
          import json, sys
          data = json.load(sys.stdin)
          assert data['include'], 'all-package build must produce contexts'
          contexts = {(x['release'], x['arch'], x['target'], x['subtarget']) for x in data['include']}
          assert ('25.12.5', 'mips_24kc', 'ath79', 'generic') in contexts
          assert ('25.12.5', 'arm_cortex-a7_neon-vfpv4', 'ipq40xx', 'generic') in contexts
          assert ('25.12.5', 'arm_cortex-a7_neon-vfpv4', 'bcm27xx', 'bcm2709') in contexts
          assert ('25.12.5', 'aarch64_cortex-a72', 'bcm27xx', 'bcm2711') in contexts
          assert ('25.12.5', 'x86_64', 'x86', '64') in contexts
          PY
