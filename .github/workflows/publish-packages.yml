name: Publish AudioWRT Package Repository
run-name: Publish packages / ${{ github.ref_name }} / ${{ inputs.package || 'changed' }}

on:
  push:
    branches:
      - main
      - testing
  workflow_dispatch:
    inputs:
      package:
        description: "Space-separated packages, or 'all'. Empty means packages changed since the previous commit."
        required: false
        default: ''
        type: string
      jobs:
        description: "Parallel SDK build jobs"
        required: true
        default: '4'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: package-repository-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref_name == 'main' || github.ref_name == 'testing'
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      channel: ${{ steps.plan.outputs.channel }}
      builder_ref: ${{ steps.plan.outputs.builder_ref }}
      should_build: ${{ steps.plan.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        shell: bash
        env:
          REQUESTED: ${{ inputs.package || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            channel=stable
            builder_ref=main
          else
            channel=testing
            builder_ref=testing
          fi

          packages="$REQUESTED"
          if [[ -z "$packages" ]]; then
            if [[ "${{ github.event_name }}" == push && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
              packages="$(python3 scripts/detect-changed-packages.py '${{ github.event.before }}' '$GITHUB_SHA')"
            else
              packages=all
            fi
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "builder_ref=$builder_ref" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [[ -n "$packages" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          printf 'Channel: %s\nBuilder: %s\nPackages: %s\n' "$channel" "$builder_ref" "${packages:-none}"

  build-publish:
    needs: plan
    if: needs.plan.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        profile:
          - tplink-tl-wdr4300-v1-minimal-usb-bluetooth-25.12.5
          - linksys-ea8300-usb-bluetooth-audio-25.12.5
          - raspberry-pi-3-usb-bluetooth-audio-25.12.5
          - raspberry-pi-4-usb-bluetooth-audio-25.12.5
          - x86-64-usb-bluetooth-audio-25.12.5
    steps:
      - name: Checkout AudioWRT packages
        uses: actions/checkout@v4

      - name: Checkout AudioWRT build engine
        uses: actions/checkout@v4
        with:
          repository: demonccc/audiowrt
          ref: ${{ needs.plan.outputs.builder_ref }}
          path: builder

      - name: Restore SDK download cache
        uses: actions/cache@v4
        with:
          path: builder/.cache/audiowrt
          key: audiowrt-packages-${{ runner.os }}-${{ matrix.profile }}-${{ needs.plan.outputs.builder_ref }}
          restore-keys: |
            audiowrt-packages-${{ runner.os }}-${{ matrix.profile }}-

      - name: Resolve package request
        id: packages
        shell: bash
        env:
          REQUESTED: ${{ needs.plan.outputs.packages }}
        run: |
          set -euo pipefail
          packages="$REQUESTED"
          if [[ "$packages" == all ]]; then
            packages="$(awk -F'|' '$0 !~ /^[[:space:]]*(#|$)/ {print $1}' builder/config/build/package-build-targets | sort -u | xargs)"
          fi
          [[ -n "$packages" ]] || { echo 'ERROR: empty package build request' >&2; exit 2; }
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Building: $packages"

      - name: Build package APKs
        shell: bash
        run: |
          set -euo pipefail
          package_ref="$(git rev-parse HEAD)"
          make -C builder packages \
            AUDIOWRT_PROFILE='${{ matrix.profile }}' \
            PACKAGE='${{ steps.packages.outputs.packages }}' \
            AUDIOWRT_PACKAGES_REF="$package_ref" \
            JOBS='${{ inputs.jobs || '4' }}' \
            VERBOSITY=normal \
            CACHE_DIR='.cache/audiowrt'

      - name: Create repository update
        id: metadata
        shell: bash
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          safe_profile="${{ matrix.profile }}"
          tag="packages-${CHANNEL}-${GITHUB_RUN_ID}-${safe_profile}-${short_sha}"
          output="builder/output/packages/${{ matrix.profile }}"
          python3 scripts/create-repository-update.py \
            --packages-dir "$output/packages" \
            --platform "$output/platform.json" \
            --profile "$output/audiowrt-profile.json" \
            --channel "$CHANNEL" \
            --release-tag "$tag" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --output "$output/repository-update.json"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "output=$output" >> "$GITHUB_OUTPUT"

      - name: Publish immutable package assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -euo pipefail
          output='${{ steps.metadata.outputs.output }}'
          tag='${{ steps.metadata.outputs.tag }}'
          args=(release create "$tag" "$output"/packages/*.apk "$output/repository-update.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "Incremental AudioWRT package build for ${{ matrix.profile }} from $GITHUB_SHA")
          if [[ "$CHANNEL" == testing ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-build-${{ needs.plan.outputs.channel }}-${{ matrix.profile }}
          path: builder/output/packages/${{ matrix.profile }}/
          if-no-files-found: warn
          retention-days: 14

  pages:
    needs:
      - plan
      - build-publish
    if: needs.plan.outputs.should_build == 'true' && needs.build-publish.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild repository metadata from release history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build-pages-repository.py --repository "$GITHUB_REPOSITORY" --output _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
