name: Publish AudioWRT Package Repository
run-name: Publish packages / ${{ github.ref_name }} / ${{ inputs.package || 'pending' }}

on:
  push:
    branches:
      - main
      - testing
  workflow_dispatch:
    inputs:
      package:
        description: "Package source directory name, 'all', or empty for pending packages"
        required: false
        default: ''
        type: string
      jobs:
        description: "Parallel make jobs inside each SDK build"
        required: true
        default: '4'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: package-repository-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref_name == 'main' || github.ref_name == 'testing'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      channel: ${{ steps.plan.outputs.channel }}
      should_build: ${{ steps.plan.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          REQUESTED: ${{ inputs.package || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == main ]] && channel=stable || channel=testing
          if [[ -n "$REQUESTED" ]]; then
            matrix="$(python3 scripts/plan-package-builds.py --package "$REQUESTED" --head "$GITHUB_SHA")"
          else
            matrix="$(python3 scripts/plan-package-builds.py --repository "$GITHUB_REPOSITORY" --channel "$channel" --head "$GITHUB_SHA")"
          fi
          count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<<"$matrix")"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          [[ "$count" -gt 0 ]] && echo "should_build=true" >> "$GITHUB_OUTPUT" || echo "should_build=false" >> "$GITHUB_OUTPUT"
          python3 -m json.tool <<<"$matrix"

  build-publish:
    needs: plan
    if: needs.plan.outputs.should_build == 'true'
    name: ${{ matrix.release }} / ${{ matrix.arch }} / ${{ matrix.task_count }} pending task(s)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore OpenWrt SDK cache
        uses: actions/cache@v4
        with:
          path: .cache/audiowrt-packages
          key: audiowrt-packages-${{ runner.os }}-${{ matrix.release }}-${{ matrix.arch }}
          restore-keys: |
            audiowrt-packages-${{ runner.os }}-${{ matrix.release }}-

      - name: Build pending packages for architecture
        shell: bash
        env:
          TASKS_JSON: ${{ matrix.tasks_json }}
          MAKE_JOBS: ${{ inputs.jobs || '4' }}
        run: |
          set -euo pipefail
          bash scripts/build-package-batch.sh \
            --release '${{ matrix.release }}' \
            --arch '${{ matrix.arch }}' \
            --tasks-json "$TASKS_JSON" \
            --output output \
            --jobs "$MAKE_JOBS"

      - name: Publish successful package outputs
        shell: bash
        env:
          TASKS_JSON: ${{ matrix.tasks_json }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          failures=0
          while IFS=$'\t' read -r package scope target subtarget; do
            [[ -n "$package" ]] || continue
            output="output/${package}/${{ matrix.release }}/${{ matrix.arch }}/${target}/${subtarget}"
            if [[ ! -d "$output/packages" ]] || ! compgen -G "$output/packages/*.apk" >/dev/null; then
              echo "ERROR: no successful output for $package / ${{ matrix.arch }} / $target/$subtarget" >&2
              failures=$((failures + 1))
              continue
            fi
            short_sha="${GITHUB_SHA:0:12}"
            safe_target="${target}-${subtarget}"
            tag="packages-${CHANNEL}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${package}-${{ matrix.release }}-${{ matrix.arch }}-${safe_target}-${short_sha}"
            if python3 scripts/create-repository-update.py \
              --packages-dir "$output/packages" --context "$output/context.json" --scope "$scope" \
              --channel "$CHANNEL" --release-tag "$tag" --repository "$GITHUB_REPOSITORY" \
              --source-commit "$GITHUB_SHA" --output "$output/repository-update.json"; then
              args=(release create "$tag" "$output"/packages/*.apk "$output/repository-update.json" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes "AudioWRT ${package} for OpenWrt ${{ matrix.release }} / ${{ matrix.arch }} / ${target}/${subtarget}")
              [[ "$CHANNEL" == testing ]] && args+=(--prerelease)
              gh "${args[@]}" || failures=$((failures + 1))
            else
              failures=$((failures + 1))
            fi
          done < <(python3 - <<'PY'
          import json, os
          for task in json.loads(os.environ['TASKS_JSON']):
              print('\t'.join((task['package'], task['scope'], task['target'], task['subtarget'])))
          PY
          )
          (( failures == 0 )) || exit 1

      - name: Upload architecture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.release }}-${{ matrix.arch }}
          path: output/
          if-no-files-found: warn
          retention-days: 14

  pages:
    needs: [plan, build-publish]
    if: always() && needs.plan.outputs.should_build == 'true' && needs.plan.result == 'success' && needs.build-publish.result != 'cancelled'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild repository metadata from successful release history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build-pages-repository.py --repository "$GITHUB_REPOSITORY" --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
