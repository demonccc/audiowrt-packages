name: Publish AudioWRT Package Repository
run-name: Publish packages / ${{ github.ref_name }} / ${{ inputs.package || 'pending' }}

on:
  push:
    branches:
      - main
      - testing
  workflow_dispatch:
    inputs:
      package:
        description: "Package source directory name, 'all', or empty for pending packages"
        required: false
        default: ''
        type: string
      jobs:
        description: "Parallel make jobs inside each SDK build"
        required: true
        default: '4'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: package-repository-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  plan:
    needs: validate
    if: github.ref_name == 'main' || github.ref_name == 'testing'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      channel: ${{ steps.plan.outputs.channel }}
      should_build: ${{ steps.plan.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        shell: bash
        env:
          REQUESTED: ${{ inputs.package || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            channel=stable
          else
            channel=testing
          fi

          if [[ -n "$REQUESTED" ]]; then
            matrix="$(python3 scripts/plan-package-builds.py --package "$REQUESTED" --head "$GITHUB_SHA")"
          else
            matrix="$(python3 scripts/plan-package-builds.py \
              --repository "$GITHUB_REPOSITORY" \
              --channel "$channel" \
              --head "$GITHUB_SHA")"
          fi

          count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<<"$matrix")"
          tasks="$(python3 -c 'import json,sys; print(sum(x["task_count"] for x in json.load(sys.stdin)["include"]))' <<<"$matrix")"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if (( count > 0 )); then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Planned $tasks pending package task(s) in $count architecture job(s) for $channel"
          python3 -m json.tool <<<"$matrix"

  build-publish:
    needs: plan
    if: needs.plan.outputs.should_build == 'true'
    name: ${{ matrix.release }} / ${{ matrix.arch }} / ${{ matrix.task_count }} pending task(s)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout AudioWRT packages
        uses: actions/checkout@v4

      - name: Restore OpenWrt SDK cache
        uses: actions/cache@v4
        with:
          path: .cache/audiowrt-packages
          key: audiowrt-packages-${{ runner.os }}-${{ matrix.release }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            audiowrt-packages-${{ runner.os }}-${{ matrix.release }}-${{ matrix.arch }}-
            audiowrt-packages-${{ runner.os }}-${{ matrix.release }}-

      - name: Build and publish pending packages for architecture
        shell: bash
        env:
          TASKS_JSON: ${{ matrix.tasks_json }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
          MAKE_JOBS: ${{ inputs.jobs || '4' }}
        run: |
          set -uo pipefail
          failures=0

          while IFS=$'\t' read -r package scope target subtarget; do
            [[ -n "$package" ]] || continue
            echo "::group::${package} / ${{ matrix.release }} / ${{ matrix.arch }} / ${target}/${subtarget}"

            output="output/${package}/${{ matrix.release }}/${{ matrix.arch }}/${target}/${subtarget}"
            if bash scripts/build-package-context.sh \
              --package "$package" \
              --release '${{ matrix.release }}' \
              --arch '${{ matrix.arch }}' \
              --target "$target" \
              --subtarget "$subtarget" \
              --output "$output" \
              --jobs "$MAKE_JOBS"; then

              short_sha="${GITHUB_SHA:0:12}"
              safe_target="${target}-${subtarget}"
              tag="packages-${CHANNEL}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${package}-${{ matrix.release }}-${{ matrix.arch }}-${safe_target}-${short_sha}"

              if python3 scripts/create-repository-update.py \
                --packages-dir "$output/packages" \
                --context "$output/context.json" \
                --scope "$scope" \
                --channel "$CHANNEL" \
                --release-tag "$tag" \
                --repository "$GITHUB_REPOSITORY" \
                --source-commit "$GITHUB_SHA" \
                --output "$output/repository-update.json"; then

                args=(release create "$tag" "$output"/packages/*.apk "$output/repository-update.json" \
                  --repo "$GITHUB_REPOSITORY" \
                  --target "$GITHUB_SHA" \
                  --title "$tag" \
                  --notes "AudioWRT ${package} for OpenWrt ${{ matrix.release }} / ${{ matrix.arch }} / ${target}/${subtarget}")
                if [[ "$CHANNEL" == testing ]]; then
                  args+=(--prerelease)
                fi
                if ! gh "${args[@]}"; then
                  echo "ERROR: failed to publish $package for ${{ matrix.arch }}" >&2
                  failures=$((failures + 1))
                fi
              else
                echo "ERROR: failed to create repository metadata for $package / ${{ matrix.arch }}" >&2
                failures=$((failures + 1))
              fi
            else
              echo "ERROR: build failed for $package / ${{ matrix.arch }} / ${target}/${subtarget}" >&2
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done < <(python3 - <<'PY'
          import json, os
          for task in json.loads(os.environ['TASKS_JSON']):
              print('\t'.join((task['package'], task['scope'], task['target'], task['subtarget'])))
          PY
          )

          if (( failures > 0 )); then
            echo "ERROR: $failures task(s) failed for ${{ matrix.arch }}; successful sibling tasks were still published." >&2
            exit 1
          fi

      - name: Upload architecture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.release }}-${{ matrix.arch }}
          path: output/
          if-no-files-found: warn
          retention-days: 14

  pages:
    needs:
      - plan
      - build-publish
    if: always() && needs.plan.outputs.should_build == 'true' && needs.plan.result == 'success' && needs.build-publish.result != 'cancelled'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild repository metadata from successful release history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build-pages-repository.py --repository "$GITHUB_REPOSITORY" --output _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
