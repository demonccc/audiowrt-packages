name: Publish AudioWRT Package Repository
run-name: Publish packages / ${{ github.ref_name }} / ${{ inputs.package || 'changed' }}

on:
  push:
    branches:
      - main
      - testing
  workflow_dispatch:
    inputs:
      package:
        description: "Package source directory name, 'all', or empty for changed packages"
        required: false
        default: ''
        type: string
      jobs:
        description: "Parallel make jobs inside each SDK build"
        required: true
        default: '4'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: package-repository-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref_name == 'main' || github.ref_name == 'testing'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      channel: ${{ steps.plan.outputs.channel }}
      should_build: ${{ steps.plan.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        shell: bash
        env:
          REQUESTED: ${{ inputs.package || '' }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            channel=stable
          else
            channel=testing
          fi

          if [[ -n "$REQUESTED" ]]; then
            matrix="$(python3 scripts/plan-package-builds.py --package "$REQUESTED")"
          elif [[ "${{ github.event_name }}" == push && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            matrix="$(python3 scripts/plan-package-builds.py --base "$BASE_SHA" --head "$HEAD_SHA")"
          else
            matrix="$(python3 scripts/plan-package-builds.py --package all)"
          fi

          count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))' <<<"$matrix")"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if (( count > 0 )); then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Planned $count package build context(s) for $channel"
          python3 -m json.tool <<<"$matrix"

  build-publish:
    needs: plan
    if: needs.plan.outputs.should_build == 'true'
    name: ${{ matrix.package }} / ${{ matrix.release }} / ${{ matrix.arch }} / ${{ matrix.target }}/${{ matrix.subtarget }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout AudioWRT packages
        uses: actions/checkout@v4

      - name: Restore OpenWrt SDK cache
        uses: actions/cache@v4
        with:
          path: .cache/audiowrt-packages
          key: audiowrt-packages-${{ runner.os }}-${{ matrix.release }}-${{ matrix.target }}-${{ matrix.subtarget }}
          restore-keys: |
            audiowrt-packages-${{ runner.os }}-${{ matrix.release }}-

      - name: Build AudioWRT package
        shell: bash
        run: |
          set -euo pipefail
          output="output/${{ matrix.package }}/${{ matrix.release }}/${{ matrix.arch }}/${{ matrix.target }}/${{ matrix.subtarget }}"
          bash scripts/build-package-context.sh \
            --package '${{ matrix.package }}' \
            --release '${{ matrix.release }}' \
            --arch '${{ matrix.arch }}' \
            --target '${{ matrix.target }}' \
            --subtarget '${{ matrix.subtarget }}' \
            --output "$output" \
            --jobs '${{ inputs.jobs || '4' }}'

      - name: Create repository update
        id: metadata
        shell: bash
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          safe_target="${{ matrix.target }}-${{ matrix.subtarget }}"
          tag="packages-${CHANNEL}-${GITHUB_RUN_ID}-${{ matrix.package }}-${{ matrix.release }}-${{ matrix.arch }}-${safe_target}-${short_sha}"
          output="output/${{ matrix.package }}/${{ matrix.release }}/${{ matrix.arch }}/${{ matrix.target }}/${{ matrix.subtarget }}"
          python3 scripts/create-repository-update.py \
            --packages-dir "$output/packages" \
            --context "$output/context.json" \
            --scope '${{ matrix.scope }}' \
            --channel "$CHANNEL" \
            --release-tag "$tag" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --output "$output/repository-update.json"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "output=$output" >> "$GITHUB_OUTPUT"

      - name: Publish successful immutable package assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -euo pipefail
          output='${{ steps.metadata.outputs.output }}'
          tag='${{ steps.metadata.outputs.tag }}'
          args=(release create "$tag" "$output"/packages/*.apk "$output/repository-update.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "AudioWRT ${{ matrix.package }} for OpenWrt ${{ matrix.release }} / ${{ matrix.arch }} / ${{ matrix.target }}/${{ matrix.subtarget }}")
          if [[ "$CHANNEL" == testing ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.package }}-${{ matrix.release }}-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.subtarget }}
          path: output/${{ matrix.package }}/${{ matrix.release }}/${{ matrix.arch }}/${{ matrix.target }}/${{ matrix.subtarget }}/
          if-no-files-found: warn
          retention-days: 14

  pages:
    needs:
      - plan
      - build-publish
    if: always() && needs.plan.outputs.should_build == 'true' && needs.plan.result == 'success' && needs.build-publish.result != 'cancelled'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild repository metadata from successful release history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build-pages-repository.py --repository "$GITHUB_REPOSITORY" --output _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
