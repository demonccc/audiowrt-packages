name: Validate AudioWRT packages

on:
  pull_request:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: Exact OpenWrt release tag used for package metadata validation
        required: true
        default: v25.12.5
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout AudioWRT packages
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            sh -n "$script"
          done < <(find . -path './.git' -prune -o -type f -perm /111 -print0)

      - name: Validate OpenWrt-derived package contract
        shell: bash
        run: bash tests/test-openwrt-derived-packages.sh

      - name: Validate reusable Wi-Fi client contract
        shell: bash
        run: bash tests/test-wifi-client-package.sh

      - name: Validate minimal BlueALSA contract
        shell: bash
        run: bash tests/test-bluealsa-minimal.sh

      - name: Validate minimal Bluetooth dependency contract
        shell: bash
        run: bash tests/test-bluetooth-minimal.sh

      - name: Validate minimal USB Audio kernel contracts
        shell: bash
        run: bash tests/test-usb-audio-kmods-minimal.sh

      - name: Validate minimal runtime libraries
        run: bash tests/test-runtime-libraries-minimal.sh

      - name: Validate appliance packages
        shell: bash
        run: |
          bash tests/test-appliance-packages.sh
          bash tests/test-provisioning-ownership.sh
          bash tests/test-distribution-file-only-packages.sh

      - name: Validate file-only package build phases
        shell: bash
        run: |
          set -euo pipefail
          for package in \
            audiowrt-audio \
            audiowrt-core \
            audiowrt-provisioning \
            audiowrt-storage \
            audiowrt-usb-audio \
            audiowrt-extensions \
            audiowrt-mpd \
            audiowrt-airplay \
            audiowrt-spotify \
            audiowrt-bluetooth \
            audiowrt-wifi-client \
            luci-app-audiowrt \
            luci-app-audiowrt-wifi-client \
            luci-app-audiowrt-core \
            luci-app-audiowrt-storage; do
            makefile="$package/Makefile"
            for phase in Prepare Configure Compile; do
              grep -q "^define Build/$phase$" "$makefile" || {
                echo "Missing explicit Build/$phase in file-only package: $package" >&2
                exit 1
              }
            done
          done

      - name: Validate OpenWrt package metadata
        shell: bash
        run: |
          set -euo pipefail
          workspace="$PWD"
          openwrt=/tmp/openwrt

          git clone --depth=1 --branch '${{ inputs.openwrt_ref || 'v25.12.5' }}' https://github.com/openwrt/openwrt.git "$openwrt"
          cd "$openwrt"

          # Production SDKs expose core package recipes through the exact-release
          # base feed. A source-tree validation checkout stores the same recipes
          # under package/, so expose the equivalent feeds/base path here.
          mkdir -p feeds
          ln -s ../package feeds/base

          cp feeds.conf.default feeds.conf
          printf '\nsrc-link audiowrt %s\n' "$workspace" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make -s prepare-tmpinfo

          for package in \
            audiowrt-busybox \
            audiowrt-minimal-alsa \
            audiowrt-minimal-mbedtls \
            audiowrt-dropbear \
            audiowrt-minidlna \
            audiowrt-umdns \
            audiowrt-wpa-supplicant \
            audiowrt-audio \
            audiowrt-core \
            audiowrt-provisioning \
            audiowrt-storage \
            audiowrt-usb-audio \
            audiowrt-extensions \
            audiowrt-mpd \
            audiowrt-airplay \
            librespot \
            audiowrt-spotify \
            audiowrt-sbc \
            audiowrt-bluez-libs \
            audiowrt-bluez \
            audiowrt-btctl \
            bluez-alsa \
            audiowrt-bluetooth \
            audiowrt-wifi-client \
            luci-app-audiowrt \
            luci-app-audiowrt-wifi-client \
            luci-app-audiowrt-core \
            audiowrt-storage-luci \
            kmod-audiowrt-bluetooth \
            kmod-audiowrt-sound-core \
            kmod-audiowrt-usb-audio; do
            grep -q "^Package: $package$" tmp/.packageinfo || {
              echo "Package metadata missing: $package" >&2
              exit 1
            }
          done
