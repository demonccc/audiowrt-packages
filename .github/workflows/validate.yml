name: Validate AudioWRT packages

on:
  pull_request:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: Exact OpenWrt release tag used for package metadata validation
        required: true
        default: v25.12.5
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout AudioWRT packages
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            sh -n "$script"
          done < <(find . -path './.git' -prune -o -type f -perm /111 -print0)

      - name: Validate OpenWrt-derived package contract
        shell: bash
        run: bash tests/test-openwrt-derived-packages.sh

      - name: Validate reusable Wi-Fi client contract
        shell: bash
        run: bash tests/test-wifi-client-package.sh

      - name: Validate minimal multicall wpad contract
        shell: bash
        run: bash tests/test-wpad-minimal.sh

      - name: Validate minimal BlueALSA contract
        shell: bash
        run: bash tests/test-bluealsa-minimal.sh

      - name: Validate minimal Bluetooth dependency contract
        shell: bash
        run: bash tests/test-bluetooth-minimal.sh

      - name: Validate minimal USB Audio kernel contracts
        shell: bash
        run: bash tests/test-usb-audio-kmods-minimal.sh

      - name: Validate minimal runtime libraries
        run: bash tests/test-runtime-libraries-minimal.sh

      - name: Validate audio runtime flash contract
        shell: bash
        run: bash tests/test-audio-runtime-state.sh

      - name: Validate native renderer, discovery and players
        shell: bash
        run: |
          bash tests/test-native-dlna.sh
          bash tests/test-dlna-codecs.sh
          bash tests/test-renderer-xml-unescape.sh

      - name: Validate AudioWRT package versioning
        shell: bash
        run: bash tests/test-package-versioning.sh

      - name: Validate appliance packages
        shell: bash
        run: |
          bash tests/test-appliance-packages.sh
          bash tests/test-provisioning-ownership.sh
          bash tests/test-distribution-file-only-packages.sh

      - name: Validate file-only package build phases
        shell: bash
        run: |
          set -euo pipefail
          for package in \
            audiowrt-audio \
            audiowrt-core \
            audiowrt-provisioning \
            audiowrt-storage \
            audiowrt-usb-audio \
            audiowrt-extensions \
            audiowrt-mpd \
            audiowrt-minimal-upmpdcli \
            audiowrt-airplay \
            audiowrt-spotify \
            audiowrt-bluetooth \
            audiowrt-wifi-client \
            luci-app-audiowrt \
            luci-app-audiowrt-wifi-client \
            luci-app-audiowrt-core \
            luci-app-audiowrt-storage \
            luci-app-audiowrt-dlna; do
            makefile="$package/Makefile"
            for phase in Prepare Configure Compile; do
              grep -q "^define Build/$phase$" "$makefile" || {
                echo "Missing explicit Build/$phase in file-only package: $package" >&2
                exit 1
              }
            done
          done

      - name: Validate OpenWrt package metadata
        shell: bash
        run: |
          set -euo pipefail
          workspace="$PWD"
          openwrt=/tmp/openwrt

          git clone --depth=1 --branch '${{ inputs.openwrt_ref || 'v25.12.5' }}' https://github.com/openwrt/openwrt.git "$openwrt"
          cd "$openwrt"

          mkdir -p feeds
          ln -s ../package feeds/base

          cp feeds.conf.default feeds.conf
          printf '\nsrc-link audiowrt %s\n' "$workspace" >> feeds.conf
          ./scripts/feeds update -a

          if [[ -d logs/feeds/audiowrt ]]; then
            while IFS= read -r -d '' dump; do
              if [[ -s "$dump" ]]; then
                echo "::group::${dump}"
                cat "$dump"
                echo "::endgroup::"
              fi
            done < <(find logs/feeds/audiowrt -name dump.txt -type f -print0 | sort -z)
          fi

          ./scripts/feeds install -a
          make -s prepare-tmpinfo

          for package in \
            audiowrt-busybox \
            libaudiowrt-alsa-minimal \
            audiowrt-minimal-upmpdcli \
            audiowrt-umdns \
            audiowrt-wpad \
            audiowrt-audio \
            audiowrt-core \
            audiowrt-provisioning \
            audiowrt-storage \
            audiowrt-usb-audio \
            audiowrt-extensions \
            audiowrt-mpd \
            audiowrt-renderer \
            libaudiowrt-player \
            audiowrt-player-flac \
            audiowrt-player-mp3 \
            audiowrt-player-aac \
            audiowrt-player-m4a \
            audiowrt-player-lpcm \
            audiowrt-player-wav \
            audiowrt-player-vorbis \
            audiowrt-player-aiff \
            audiowrt-player-opus \
            audiowrt-player-ffmpeg \
            luci-app-audiowrt-renderer \
            audiowrt-airplay \
            librespot \
            audiowrt-spotify \
            audiowrt-bluez \
            audiowrt-sbc \
            audiowrt-btctl \
            bluez-alsa \
            audiowrt-bluetooth \
            audiowrt-wifi-client \
            luci-app-audiowrt \
            luci-app-audiowrt-wifi-client \
            luci-app-audiowrt-core \
            audiowrt-storage-luci \
            kmod-audiowrt-bluetooth \
            kmod-audiowrt-sound-core \
            kmod-audiowrt-usb-audio; do
            grep -q "^Package: $package$" tmp/.packageinfo || {
              echo "Package metadata missing: $package" >&2
              exit 1
            }
          done
