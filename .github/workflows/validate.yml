name: Validate AudioWRT packages

on:
  pull_request:
  push:
    branches:
      - main
      - testing
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: Exact OpenWrt release tag used for package metadata validation
        required: true
        default: v25.12.5
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout AudioWRT packages
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile Python tooling
        run: python3 -m py_compile scripts/*.py tests/test-package-planner-state.py

      - name: Validate planner state helpers
        run: python3 tests/test-package-planner-state.py

      - name: Validate shell tooling
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-package-context.sh
          while IFS= read -r -d '' script; do
            case "$(head -n 1 "$script")" in
              '#!'*bash*) bash -n "$script" ;;
              '#!'*/sh*) sh -n "$script" ;;
            esac
          done < <(find . -path './.git' -prune -o -type f -print0)

      - name: Validate architecture matrix
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('repository/build-matrix.toml').read_text())
          assert data['schema_version'] == 1
          arches = data['architectures']
          expected = {
              'mips_24kc',
              'arm_cortex-a7_neon-vfpv4',
              'aarch64_cortex-a72',
              'x86_64',
          }
          assert set(arches) == expected
          for arch, cfg in arches.items():
              assert cfg['versions']
              for version, version_cfg in cfg['versions'].items():
                  assert version
                  assert '/' in version_cfg['sdk_target']
                  assert version_cfg['kernel_targets']
                  assert all('/' in item for item in version_cfg['kernel_targets'])
          PY

      - name: Validate rebuild rules
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('repository/rebuild-dependents.json').read_text())
          assert data['schema'] == 1
          assert isinstance(data['rebuild_dependents'], dict)
          for package, dependents in data['rebuild_dependents'].items():
              assert package
              assert isinstance(dependents, list)
              assert len(dependents) == len(set(dependents))
          PY

      - name: Smoke-test architecture-grouped planner
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/plan-package-builds.py --base HEAD --head HEAD)"
          python3 -c 'import json,sys; assert json.load(sys.stdin) == {"include": []}' <<<"$matrix"

          matrix="$(python3 scripts/plan-package-builds.py --package all)"
          MATRIX="$matrix" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['MATRIX'])
          jobs = data['include']
          assert len(jobs) == 4, f'expected one job per architecture, got {len(jobs)}'
          expected_arches = {
              'mips_24kc',
              'arm_cortex-a7_neon-vfpv4',
              'aarch64_cortex-a72',
              'x86_64',
          }
          assert {job['arch'] for job in jobs} == expected_arches
          assert len({(job['release'], job['arch']) for job in jobs}) == len(jobs)
          for job in jobs:
              tasks = json.loads(job['tasks_json'])
              assert tasks
              assert job['task_count'] == len(tasks)
              assert all({'package', 'scope', 'target', 'subtarget'} <= set(task) for task in tasks)
          arm = next(job for job in jobs if job['arch'] == 'arm_cortex-a7_neon-vfpv4')
          arm_tasks = json.loads(arm['tasks_json'])
          kernel_targets = {(t['target'], t['subtarget']) for t in arm_tasks if t['scope'] == 'kernel'}
          assert ('ipq40xx', 'generic') in kernel_targets
          assert ('bcm27xx', 'bcm2709') in kernel_targets
          PY

          matrix="$(python3 scripts/plan-package-builds.py --package bluez-trimmed)"
          MATRIX="$matrix" python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['MATRIX'])['include']
          assert len(jobs) == 4, f'bluez-trimmed must create one job per architecture, got {len(jobs)}'
          for job in jobs:
              packages = {task['package'] for task in json.loads(job['tasks_json'])}
              assert 'bluez-trimmed' in packages
          PY

      - name: Validate wpad syslog patch
        shell: bash
        run: bash tests/test-wpad-syslog-patch.sh

      - name: Exercise runtime behavior with real UCI
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          git -C "$work" init -q
          git -C "$work" fetch -q --depth=1 https://github.com/openwrt/uci.git 74f6277aabffc943d026f406df57c22595134c42
          git -C "$work" checkout -q FETCH_HEAD
          printf '#define UCI_DEBUG 1\n' > "$work/uci_config.h"
          cc -O2 -o "$work/uci" "$work"/{cli,libuci,file,util,delta,parse}.c
          UCI_BIN="$work/uci" python3 tests/test-runtime-behavior.py
          bash tests/test-device-identity.sh

      - name: Validate flash write policy
        shell: bash
        run: bash tests/test-flash-write-policy.sh

      - name: Validate AudioWRT package versioning
        shell: bash
        run: bash tests/test-package-versioning.sh

      - name: Validate OpenWrt package metadata
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          workspace="$PWD"
          openwrt=/tmp/openwrt

          git clone --depth=1 --branch '${{ inputs.openwrt_ref || 'v25.12.5' }}' https://github.com/openwrt/openwrt.git "$openwrt"
          cd "$openwrt"

          mkdir -p feeds
          ln -s ../package feeds/base

          cp feeds.conf.default feeds.conf
          printf '\nsrc-link audiowrt %s\n' "$workspace" >> feeds.conf
          ./scripts/feeds update -a

          if [[ -d logs/feeds/audiowrt ]]; then
            while IFS= read -r -d '' dump; do
              if [[ -s "$dump" ]]; then
                echo "::group::${dump}"
                cat "$dump"
                echo "::endgroup::"
              fi
            done < <(find logs/feeds/audiowrt -name dump.txt -type f -print0 | sort -z)
          fi

          ./scripts/feeds install -a
          make -s prepare-tmpinfo

          while IFS= read -r makefile; do
            while IFS= read -r package; do
              grep -q "^Package: $package$" tmp/.packageinfo || {
                echo "Package metadata missing: $package" >&2
                exit 1
              }
            done < <(sed -n 's/^define Package\/\([^[:space:]]*\).*/\1/p' "$makefile")
          done < <(find "$workspace" -name Makefile -type f | sort)
