name: Validate AudioWRT packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: Exact OpenWrt release tag used for package metadata validation
        required: true
        default: v25.12.5
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout AudioWRT packages
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            case "$(head -n 1 "$script")" in
              '#!'*bash*) bash -n "$script" ;;
              '#!'*/sh*) sh -n "$script" ;;
            esac
          done < <(find . -path './.git' -prune -o -type f -print0)

      - name: Validate wpad syslog patch
        shell: bash
        run: bash tests/test-wpad-syslog-patch.sh

      - name: Exercise runtime behavior with real UCI
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          git -C "$work" init -q
          git -C "$work" fetch -q --depth=1 https://github.com/openwrt/uci.git 74f6277aabffc943d026f406df57c22595134c42
          git -C "$work" checkout -q FETCH_HEAD
          printf '#define UCI_DEBUG 1\n' > "$work/uci_config.h"
          cc -O2 -o "$work/uci" "$work"/{cli,libuci,file,util,delta,parse}.c
          UCI_BIN="$work/uci" python3 tests/test-runtime-behavior.py
          bash tests/test-device-identity.sh

      - name: Validate flash write policy
        shell: bash
        run: bash tests/test-flash-write-policy.sh

      - name: Validate AudioWRT package versioning
        shell: bash
        run: bash tests/test-package-versioning.sh

      - name: Validate OpenWrt package metadata
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          workspace="$PWD"
          openwrt=/tmp/openwrt

          git clone --depth=1 --branch '${{ inputs.openwrt_ref || 'v25.12.5' }}' https://github.com/openwrt/openwrt.git "$openwrt"
          cd "$openwrt"

          mkdir -p feeds
          ln -s ../package feeds/base

          cp feeds.conf.default feeds.conf
          printf '\nsrc-link audiowrt %s\n' "$workspace" >> feeds.conf
          ./scripts/feeds update -a

          if [[ -d logs/feeds/audiowrt ]]; then
            while IFS= read -r -d '' dump; do
              if [[ -s "$dump" ]]; then
                echo "::group::${dump}"
                cat "$dump"
                echo "::endgroup::"
              fi
            done < <(find logs/feeds/audiowrt -name dump.txt -type f -print0 | sort -z)
          fi

          ./scripts/feeds install -a
          make -s prepare-tmpinfo

          for package in \
            audiowrt-airplay \
            audiowrt-audio \
            audiowrt-bluetooth \
            audiowrt-distro-branding \
            audiowrt-btctl \
            audiowrt-config \
            audiowrt-core \
            audiowrt-dlna-renderer \
            audiowrt-network-client \
            audiowrt-player-mpd \
            audiowrt-player-aac \
            audiowrt-player-aiff \
            audiowrt-player-ffmpeg \
            audiowrt-player-flac \
            audiowrt-player-lpcm \
            audiowrt-player-m4a \
            audiowrt-player-mp3 \
            audiowrt-player-opus \
            audiowrt-player-vorbis \
            audiowrt-player-wav \
            audiowrt-provisioning \
            audiowrt-spotify \
            audiowrt-usb-audio \
            audiowrt-wifi-client \
            libaudiowrt-player \
            luci-app-audiowrt \
            luci-app-audiowrt-core \
            luci-app-audiowrt-dlna \
            luci-app-audiowrt-network-client \
            luci-theme-audiowrt \
            bluez-alsa \
            librespot \
            alsa-lib-trimmed \
            bluez-trimmed \
            dbus-trimmed \
            dropbear-trimmed \
            kmod-bluetooth-trimmed \
            sbc-trimmed \
            umdns-trimmed \
            busybox-udhcpd-tailored \
            hostapd-wpa-supplicant-tailored \
            luci-mod-status-tailored; do
            grep -q "^Package: $package$" tmp/.packageinfo || {
              echo "Package metadata missing: $package" >&2
              exit 1
            }
          done
